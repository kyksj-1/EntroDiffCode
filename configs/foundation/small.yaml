# =============================================================================
# Foundation Model · SMALL 配置 (RTX 3090 24GB)
# 工程方案: Docs/black/W5_foundation_engineering_plan.md §2.4.2
# =============================================================================

experiment:
  name: "foundation_small"
  epochs: 200
  learning_rate: 2.0e-4
  batch_size: 64
  grad_accum_steps: 1
  use_amp: false              # BVAware 二阶导 + GradScaler 不兼容; small 也关
                              # (DiT-Plain 可以试 use_amp: true)

  nu: 1.0
  tau_max: 1.0

  ckpt_every: 10

model:
  type: "dit_bvaware"
  in_channels: 2

  dit:
    Nx: 128
    dim: 256
    n_layers: 6
    n_heads: 8
    patch_size: 4
    dropout: 0.1

loss:
  lambda_dsm: 1.0
  lambda_bv: 0.1
  lambda_time: 0.5            # 时间一致性 loss (W5-B 论文亮点)

data:
  conditioning_type: "ic"
  mix_strategy: "uniform"
  pdes:
    - name: "burgers"
      data_file: "burgers_1d_N5000_Nx128.npy"
      flux_type: "burgers"
      weight: 1.0
    - name: "buckley_leverett"
      data_file: "bl_1d_N5000_Nx128.npy"
      flux_type: "buckley_leverett"
      weight: 1.0
