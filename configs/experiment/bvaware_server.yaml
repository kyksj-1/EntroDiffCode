# BV-aware 训练配置 (服务器专用, 大模型 + 多 epoch)
experiment:
  name: "bvaware_run"
  epochs: 200                   # 服务器全量训练
  learning_rate: 2.0e-4
  nu: 1.0
  tau_max: 1.0
  lambda_bv: 0.1
  lambda_dsm: 1.0
  heun_steps: 50
  zeta_pde: 0.1                 # Godunov PDE guidance (Ours 独有)
  data_file: "burgers_1d_N5000_Nx128.npy"
