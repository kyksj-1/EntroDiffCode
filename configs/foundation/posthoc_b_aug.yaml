# =============================================================================
# Foundation Model · POSTHOC_B_AUG 配置 (方案 B + IC augmentation)
# 论文对应: §5.6 OOD-2 amp×2 救场升级 — IC scale + noise 增强训练分布
#
# 与 posthoc_b.yaml 的差异:
#   - experiment.name:  foundation_posthoc_b_aug
#   - augmentation 块:  IC scale [0.7, 1.3] + noise 0.02
#   - epochs:           50 → 80 (aug 增加方差, 多训点)
#   - phi_sh_dim/kappa_dim/depth: 与 small (default) 同
#
# 设计动机:
#   PostHoc-B small 在 OOD-2 amp×2 上 W₁=0.2640 (-5.1% vs Plain)
#   但 in-dist Burgers (amp 是训练分布) W₁=0.0842 比 Plain 0.0821 略输
#   Aug 训练让 PostHoc-B 见过更多 amp 范围 → OOD-2 进一步降, in-dist 不退化
# =============================================================================

experiment:
  name: "foundation_posthoc_b_aug"
  epochs: 80                    # aug 多训
  learning_rate: 5.0e-4
  batch_size: 64
  grad_accum_steps: 1
  use_amp: false

  nu: 1.0
  tau_max: 1.0
  ckpt_every: 20

  use_ema: true                 # ← 方案 3 EMA 默认开
  ema_decay: 0.9995

  augmentation:                 # ← 方案 4b IC augmentation
    ic_scale_min: 0.7
    ic_scale_max: 1.3
    ic_noise_sigma: 0.02
    target_scale_with_ic: true   # x_target 同步缩放 (Burgers 缩放近似不变)

model:
  type: "posthoc_bv"
  in_channels: 2
  plain_ckpt: "output/experiments/foundation_small_plain/foundation_foundation_small_plain_20260503_024957_ep200.pt"
  # 与 small 相同容量 (~386 params)
  phi_sh_dim: 32
  kappa_dim: 16
  depth: 2

loss:
  lambda_dsm: 1.0
  lambda_bv: 0.0
  lambda_time: 0.0

data:
  conditioning_type: "ic"
  mix_strategy: "uniform"
  pdes:
    - name: "burgers"
      data_file: "burgers_1d_N5000_Nx128.npy"
      flux_type: "burgers"
      weight: 1.0
    - name: "buckley_leverett"
      data_file: "bl_1d_N5000_Nx128.npy"
      flux_type: "buckley_leverett"
      weight: 1.0
